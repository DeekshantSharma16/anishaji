name: Keep the database awake

# Supabase pauses a free project after seven days without a database request.
# This hits /api/public/health every three days, which is well inside that
# window even if a run is skipped or GitHub delays the schedule.
#
# Setup: add a repository variable named SITE_URL, set to your live site
# (Settings -> Secrets and variables -> Actions -> Variables).
# Example: https://wellnesswithanisha.com
#
# You can delete this workflow once the site has steady traffic — real
# visitors keep the project awake on their own.

on:
  schedule:
    # 06:30 UTC = midday IST, every third day.
    - cron: "30 6 */3 * *"
  # So you can also trigger it by hand from the Actions tab.
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the health endpoint
        run: |
          if [ -z "${{ vars.SITE_URL }}" ]; then
            echo "SITE_URL repository variable is not set."
            exit 1
          fi

          # --fail turns a 503 into a non-zero exit, so a database that has
          # already been paused shows up as a failed run and emails you,
          # rather than passing quietly.
          curl --fail --silent --show-error --max-time 30 \
            "${{ vars.SITE_URL }}/api/public/health"
